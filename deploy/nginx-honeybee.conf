# Example nginx config — NOT applied automatically. Adapt server_name, paths,
# and TLS/certbot setup to match this box's existing configuration.
#
# limit_req_zone MUST live in the http{} context (nginx.conf, or a file
# included from it), not inside a server{} block. Add the line below
# alongside whatever's already defined there for the box's other site,
# then keep only the server{} block here.

limit_req_zone $binary_remote_addr zone=honeybee_contact:10m rate=5r/m;

server {
    listen 80;
    server_name honeybee-early-learning.com www.honeybee-early-learning.com;
    # adapt to this box's existing TLS/certbot setup

    location /static/ {
        alias /srv/honeybee-early-learning/app/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /contact {
        limit_req zone=honeybee_contact burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
