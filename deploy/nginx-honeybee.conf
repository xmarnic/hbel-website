# Deploys to /etc/nginx/sites-available/honeybeelearning.kids on the box.
# See nginx-config/ for the teardown that cleared the rest of this
# (formerly multi-tenant) server down to just this site + nickmarl.in.
#
# limit_req_zone MUST live in the http{} context (nginx.conf), not inside
# a server{} block — add this line to /etc/nginx/nginx.conf's http{} block:
#   limit_req_zone $binary_remote_addr zone=honeybee_contact:10m rate=5r/m;

server {
    listen 80;
    server_name honeybeelearning.kids www.honeybeelearning.kids;
    # adapt to this box's existing TLS/certbot setup

    location /static/ {
        alias /srv/honeybee-early-learning/app/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /contact {
        limit_req zone=honeybee_contact burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
